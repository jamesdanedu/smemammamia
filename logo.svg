<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#eaf4fb"/>
      <stop offset="100%" stop-color="#fbf9f5"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2f93d4"/>
      <stop offset="100%" stop-color="#14527f"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0%"   stop-color="#2f93d4"/>
      <stop offset="50%"  stop-color="#1b6ca8"/>
      <stop offset="100%" stop-color="#14527f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#sky)"/>
  <circle cx="985" cy="118" r="62" fill="#e0a020" opacity="0.85"/>

  <!-- whitewashed chapel, left -->
  <g>
    <rect x="118" y="228" width="150" height="150" fill="#ffffff" stroke="#cbdae3" stroke-width="3"/>
    <path d="M118 228a75 75 0 0 1 150 0z" fill="#1b6ca8"/>
    <rect x="176" y="300" width="34" height="78" rx="17" fill="#1b6ca8" opacity="0.85"/>
    <rect x="108" y="374" width="170" height="10" fill="#ffffff" stroke="#cbdae3" stroke-width="2"/>
  </g>

  <!-- bougainvillea sprig, right -->
  <g fill="#c2356b" opacity="0.9">
    <circle cx="1010" cy="300" r="15"/><circle cx="1044" cy="278" r="12"/>
    <circle cx="1042" cy="322" r="11"/><circle cx="1074" cy="302" r="14"/>
    <circle cx="1078" cy="262" r="10"/><circle cx="1104" cy="286" r="9"/>
  </g>
  <path d="M960 356c40-22 74-36 132-58" stroke="#6f8b4e" stroke-width="7" fill="none" stroke-linecap="round"/>

  <!-- wordmark -->
  <text x="600" y="322" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="148" font-weight="700" letter-spacing="-1" fill="url(#ink)">MAMMA MIA!</text>

  <line x1="392" y1="366" x2="808" y2="366" stroke="#cbdae3" stroke-width="3"/>

  <text x="600" y="416" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="34" font-weight="400" letter-spacing="9" fill="#c2356b">THE MUSICAL</text>

  <text x="600" y="474" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="28" letter-spacing="2" fill="#5a6d7a">
    St Mary's Secondary School, Edenderry
  </text>

  <!-- sea -->
  <path d="M0 520c120-26 200 16 330 16s200-40 330-40 210 34 320 20 220-22 220-22v136H0z" fill="url(#sea)" opacity="0.30"/>
  <path d="M0 556c130-24 210 18 340 18s205-38 335-38 205 32 315 18 210-20 210-20v96H0z" fill="url(#sea)"/>
</svg>
